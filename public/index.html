<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check Universe</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(
          135deg,
          #0a1929 0%,
          #132f4c 50%,
          #0d3b66 100%
        );
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow-x: hidden;
        position: relative;
      }

      /* Wave animation background */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 200%;
        height: 200%;
        background:
          radial-gradient(
            circle at 20% 50%,
            rgba(30, 144, 255, 0.1) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(70, 130, 180, 0.1) 0%,
            transparent 50%
          );
        animation: waves 15s ease-in-out infinite;
        pointer-events: none;
        z-index: 0;
      }

      @keyframes waves {
        0%,
        100% {
          transform: translate(0, 0);
        }

        25% {
          transform: translate(-50px, -30px);
        }

        50% {
          transform: translate(-100px, 0);
        }

        75% {
          transform: translate(-50px, 30px);
        }
      }

      .header {
        text-align: center;
        margin-bottom: 50px;
        z-index: 10;
        position: relative;
      }

      .header h1 {
        color: #ffffff;
        font-size: 3.5em;
        font-weight: 700;
        margin-bottom: 10px;
        text-shadow: 0 8px 32px rgba(30, 144, 255, 0.3);
        letter-spacing: 2px;
      }

      .header p {
        color: rgba(255, 255, 255, 0.7);
        font-size: 1.1em;
        letter-spacing: 1px;
      }

      .progress-bar {
        width: 300px;
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        margin-top: 20px;
        overflow: hidden;
        backdrop-filter: blur(10px);
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #1e90ff, #00bfff);
        width: 0%;
        border-radius: 10px;
        transition: width 0.3s ease;
        box-shadow: 0 0 20px rgba(30, 144, 255, 0.6);
      }

      .header {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      #container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
        gap: 15px;
        max-width: 1200px;
        z-index: 10;
        position: relative;
      }

      .checkbox-wrapper {
        position: relative;
        width: 60px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .checkbox-wrapper input[type="checkbox"] {
        display: none;
      }

      .checkbox-custom {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(30, 144, 255, 0.5);
        border-radius: 12px;
        position: relative;
        background: linear-gradient(
          135deg,
          rgba(30, 144, 255, 0.1),
          rgba(70, 130, 180, 0.1)
        );
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: inset 0 0 20px rgba(30, 144, 255, 0.1);
        backdrop-filter: blur(10px);
      }

      .checkbox-wrapper input[type="checkbox"]:checked + .checkbox-custom {
        background: linear-gradient(135deg, #1e90ff, #00bfff);
        border-color: #00bfff;
        box-shadow:
          0 0 30px rgba(0, 191, 255, 0.6),
          inset 0 0 20px rgba(30, 144, 255, 0.2);
        transform: scale(1.1);
      }

      .checkmark {
        color: white;
        font-size: 28px;
        font-weight: bold;
        opacity: 0;
        transform: scale(0) rotate(-45deg);
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        text-shadow: 0 0 10px rgba(0, 191, 255, 0.8);
      }

      .checkbox-wrapper
        input[type="checkbox"]:checked
        + .checkbox-custom
        .checkmark {
        opacity: 1;
        transform: scale(1) rotate(0deg);
        animation: checkPulse 0.6s ease-out;
      }

      @keyframes checkPulse {
        0% {
          transform: scale(0) rotate(-45deg);
          opacity: 0;
        }

        50% {
          transform: scale(1.3) rotate(10deg);
        }

        100% {
          transform: scale(1) rotate(0deg);
          opacity: 1;
        }
      }

      .checkbox-wrapper:hover .checkbox-custom {
        border-color: #1e90ff;
        transform: translateY(-3px);
        box-shadow:
          0 0 30px rgba(30, 144, 255, 0.4),
          inset 0 0 20px rgba(30, 144, 255, 0.1);
      }

      .checkbox-wrapper
        input[type="checkbox"]:checked
        + .checkbox-custom::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100%;
        height: 100%;
        background: radial-gradient(
          circle,
          rgba(0, 191, 255, 0.5),
          transparent
        );
        border-radius: 12px;
        animation: checkRipple 0.6s ease-out forwards;
        pointer-events: none;
      }

      @keyframes checkRipple {
        0% {
          transform: translate(-50%, -50%) scale(0);
          opacity: 1;
        }

        100% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 0;
        }
      }

      /* Error Notification Styles */
      .error-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 400px;
        pointer-events: none;
      }

      .error-notification {
        background: linear-gradient(
          135deg,
          rgba(255, 71, 87, 0.95),
          rgba(255, 109, 109, 0.95)
        );
        border: 2px solid rgba(255, 71, 87, 0.8);
        border-radius: 12px;
        padding: 16px 20px;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 40px rgba(255, 71, 87, 0.3);
        animation: slideInRight 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        pointer-events: auto;
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }

      @keyframes slideInRight {
        from {
          transform: translateX(450px);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      .error-notification.fade-out {
        animation: slideOutRight 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      @keyframes slideOutRight {
        to {
          transform: translateX(450px);
          opacity: 0;
        }
      }

      .error-icon {
        font-size: 24px;
        color: #fff;
        flex-shrink: 0;
        margin-top: 2px;
      }

      .error-content {
        flex: 1;
      }

      .error-title {
        color: #fff;
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 4px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
      }

      .error-message {
        color: rgba(255, 255, 255, 0.95);
        font-size: 13px;
        line-height: 1.4;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }

      .error-close {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        font-size: 18px;
        cursor: pointer;
        border-radius: 6px;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: all 0.2s ease;
        padding: 0;
      }

      .error-close:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: scale(1.1);
      }

      .error-close:active {
        transform: scale(0.95);
      }

      .stats {
        margin-top: 40px;
        display: flex;
        gap: 30px;
        justify-content: center;
        z-index: 10;
        position: relative;
      }

      .stat-item {
        text-align: center;
        padding: 20px 30px;
        background: rgba(30, 144, 255, 0.1);
        border: 2px solid rgba(30, 144, 255, 0.3);
        border-radius: 15px;
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
      }

      .stat-item:hover {
        background: rgba(30, 144, 255, 0.2);
        border-color: rgba(30, 144, 255, 0.6);
        transform: translateY(-5px);
      }

      .stat-item .number {
        font-size: 2.5em;
        font-weight: bold;
        color: #00bfff;
        text-shadow: 0 0 20px rgba(0, 191, 255, 0.5);
      }

      .stat-item .label {
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.9em;
        margin-top: 8px;
        letter-spacing: 1px;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .header h1 {
          font-size: 2.5em;
        }

        #container {
          grid-template-columns: repeat(auto-fit, minmax(50px, 1fr));
          gap: 12px;
          max-width: 600px;
        }

        .checkbox-wrapper {
          width: 50px;
          height: 50px;
        }

        .checkbox-custom {
          width: 45px;
          height: 45px;
        }

        .stats {
          flex-direction: column;
          gap: 15px;
        }
      }
    </style>
  </head>

  <body>
    <div class="error-container" id="errorContainer"></div>

    <div class="header">
      <h1>✓ Check Universe</h1>
      <p>Click your way through infinity</p>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div id="container"></div>

    <div class="stats">
      <div class="stat-item">
        <div class="number" id="checkedCount">0</div>
        <div class="label">CHECKED</div>
      </div>
      <div class="stat-item">
        <div class="number" id="percentage">0%</div>
        <div class="label">PROGRESS</div>
      </div>
      <div class="stat-item">
        <div class="number" id="totalCount">100</div>
        <div class="label">TOTAL</div>
      </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      const containerEl = document.getElementById("container");

      let checkedCount = 0;
      let totalCheckboxes = 100;

      function updateStats() {
        const percentage = totalCheckboxes > 0 ? Math.round((checkedCount / totalCheckboxes) * 100) : 0;
        document.getElementById("checkedCount").textContent = checkedCount;
        document.getElementById("percentage").textContent = percentage + "%";
        document.getElementById("progressFill").style.width = percentage + "%";
        document.getElementById("totalCount").textContent = totalCheckboxes;
      }

      async function fetchDataFromTheServer() {
        container.replaceChildren();
        const response = await fetch("/checkboxes", { method: "GET" });

        const { checkboxes } = await response.json();
        totalCheckboxes = checkboxes.length;
        checkedCount = checkboxes.filter(Boolean).length;

        checkboxes.forEach((value, index) => {
          const wrapper = document.createElement("label");
          wrapper.className = "checkbox-wrapper";

          const input = document.createElement("input");
          input.type = "checkbox";
          input.dataset.index = index;
          input.checked = value;

          const customCheckbox = document.createElement("div");
          customCheckbox.className = "checkbox-custom";
          customCheckbox.innerHTML = '<span class="checkmark">✓</span>';

          wrapper.appendChild(input);
          wrapper.appendChild(customCheckbox);
          containerEl.appendChild(wrapper);
        });

        updateStats();
      }

      // Show error notification
      function showError(errorMsg, duration = 5000) {
        const errorContainer = document.getElementById("errorContainer");

        const errorNotification = document.createElement("div");
        errorNotification.className = "error-notification";

        errorNotification.innerHTML = `
          <div class="error-icon">⚠️</div>
          <div class="error-content">
            <div class="error-title">Error</div>
            <div class="error-message">${errorMsg}</div>
          </div>
          <button class="error-close">✕</button>
        `;

        const closeBtn = errorNotification.querySelector(".error-close");

        const removeError = () => {
          errorNotification.classList.add("fade-out");
          setTimeout(() => {
            errorNotification.remove();
          }, 400);
        };

        closeBtn.addEventListener("click", removeError);

        errorContainer.appendChild(errorNotification);

        // Auto-dismiss after specified duration
        setTimeout(() => {
          if (errorNotification.parentElement) {
            removeError();
          }
        }, duration);
      }

      //on user load get the checkboxes array from server and render the checkboxes
      window.addEventListener("load", async () => {
        fetchDataFromTheServer();
      });

      containerEl.addEventListener("change", (e) => {
        const userData = sessionStorage.getItem("userData");
        if (!userData) {
          console.error("You are not login!");
          window.location.href = "/login.html";
          return;
        }

        if (e.target.checked) checkedCount++; else checkedCount--;
        updateStats();
        checkboxFiled(e.target.checked, e.target.dataset.index);
        <!-- fetchDataFromTheServer(); -->
      });
      // yaah per error show hoga ager jyda req aayi
      socket.on("server:error", (message) => {
        const errorMessage = message.error;
        showError(errorMessage);
      });
      socket.on("server:checkbox-response", (data) => {
        const input = containerEl.querySelector(
          `input[data-index="${data.checkboxId}"]`,
        );
        input.checked = data.isChecked;
      });

      // socket function
      function checkboxFiled(event, checkboxId) {
        const user = JSON.parse(sessionStorage.getItem("userData"));

        console.log(checkboxId, event);
        socket.emit("client:checkbox-checked", {
          checkboxId,
          isChecked: event,
          userId: user.sub,
        });
        fetchDataFromTheServer();
      }
    </script>
  </body>
</html>
